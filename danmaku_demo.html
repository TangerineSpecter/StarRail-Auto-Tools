<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星穹铁道风格 - 浮动弹幕演示</title>
  <style>
    :root {
      --primary: #cba365;
      --primary-glow: rgba(203, 163, 101, 0.4);
      --bg-dark: #0f111a;
    }
    
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1c1f2e 0%, var(--bg-dark) 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .demo-title {
      text-align: center;
      z-index: 1;
      opacity: 0.8;
      pointer-events: none;
    }
    
    .demo-title h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #cba365);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(203, 163, 101, 0.3));
    }

    .demo-title p {
      font-size: 1.2rem;
      color: #9aa0b1;
    }

    .danmaku-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .danmaku-track {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      
      /* Base Style: Glassmorphism */
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      
      /* Animation */
      will-change: transform, opacity;
      animation: slide-left linear forwards;
    }

    /* 样式 1: 星穹金色 (开拓) */
    .style-trailblazer {
      color: #fff;
      border-color: rgba(203, 163, 101, 0.5);
      background: linear-gradient(90deg, rgba(203, 163, 101, 0.15) 0%, rgba(203, 163, 101, 0.05) 100%);
      box-shadow: 0 4px 20px var(--primary-glow), inset 0 0 10px rgba(203, 163, 101, 0.2);
      text-shadow: 0 0 8px rgba(203, 163, 101, 0.6);
    }
    .style-trailblazer::before {
      content: "🚂";
      font-size: 24px;
      filter: drop-shadow(0 0 5px rgba(203, 163, 101, 0.8));
    }

    /* 样式 2: 星核猎手 (玫红/暗紫) */
    .style-stellaron {
      color: #fff;
      border-color: rgba(216, 73, 126, 0.5);
      background: linear-gradient(90deg, rgba(216, 73, 126, 0.15) 0%, rgba(77, 40, 99, 0.15) 100%);
      box-shadow: 0 4px 20px rgba(216, 73, 126, 0.3), inset 0 0 10px rgba(216, 73, 126, 0.2);
      text-shadow: 0 0 8px rgba(216, 73, 126, 0.6);
    }
    .style-stellaron::before {
      content: "🕸️";
      font-size: 24px;
      filter: drop-shadow(0 0 5px rgba(216, 73, 126, 0.8));
    }

    /* 样式 3: 群星 (青白/星光) */
    .style-stars {
      color: #e0f7fa;
      border-color: rgba(128, 222, 234, 0.5);
      background: linear-gradient(90deg, rgba(128, 222, 234, 0.15) 0%, rgba(128, 222, 234, 0.05) 100%);
      box-shadow: 0 4px 20px rgba(128, 222, 234, 0.3), inset 0 0 10px rgba(128, 222, 234, 0.2);
      text-shadow: 0 0 8px rgba(128, 222, 234, 0.6);
    }
    .style-stars::before {
      content: "✨";
      font-size: 24px;
      filter: drop-shadow(0 0 5px rgba(128, 222, 234, 0.8));
    }

    /* 主滑动动画 */
    @keyframes slide-left {
      0% {
        transform: translateX(100vw) scale(0.9);
        opacity: 0;
      }
      5% {
        opacity: 1;
        transform: translateX(95vw) scale(1);
      }
      95% {
        opacity: 1;
        transform: translateX(-100%) scale(1);
      }
      100% {
        transform: translateX(-110%) scale(0.9);
        opacity: 0;
      }
    }
    
    /* 附加一个轻微的上下浮动，通过包裹层实现更活泼的效果 */
    .float-wrapper {
      position: absolute;
      will-change: transform;
      animation: float-y 4s ease-in-out infinite alternate;
      /* 通过行内样式指定初始 right 保证从右侧进入 */
      left: 0; 
      width: 100%;
    }

    @keyframes float-y {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(8px); }
    }
  </style>
</head>
<body>

  <div class="demo-title">
    <h1>浮动弹幕演示</h1>
    <p>活泼、通透的样式设计</p>
  </div>

  <div class="danmaku-container" id="danmaku-container"></div>

  <script>
    const danmakuData = [
      { text: "愿此行，终抵群星", style: "style-stars" },
      { text: "开拓继续向前✨", style: "style-trailblazer" },
      { text: "星核猎手登场", style: "style-stellaron" }
    ];

    const container = document.getElementById('danmaku-container');
    const trackCount = 8; // 将屏幕垂直分为几条轨道，避免弹幕重叠
    const trackHeight = 100 / trackCount;
    
    // 记录轨道上一次发射弹幕的时间
    const trackLastFired = new Array(trackCount).fill(0);

    function createDanmaku() {
      const data = danmakuData[Math.floor(Math.random() * danmakuData.length)];
      
      // 随机选择一个轨道
      let availableTracks = [];
      const now = Date.now();
      for(let i = 1; i < trackCount - 1; i++) { // 避免最顶和最底
        // 如果该轨道过去 2.5 秒内没有发过弹幕，则认为是可用的
        if(now - trackLastFired[i] > 2500) {
          availableTracks.push(i);
        }
      }
      
      if(availableTracks.length === 0) return; // 如果太拥挤就先不发
      
      const trackIndex = availableTracks[Math.floor(Math.random() * availableTracks.length)];
      trackLastFired[trackIndex] = now;

      // 创建上下浮动的外壳
      const wrapper = document.createElement('div');
      wrapper.className = 'float-wrapper';
      // 错开浮动动画的时间
      wrapper.style.animationDelay = `-${Math.random() * 4}s`;
      // 轨道的纵向位置 (稍加一点随机偏移)
      const topOffset = (trackIndex * trackHeight) + (Math.random() * 4 - 2);
      wrapper.style.top = `${topOffset}%`;

      // 创建弹幕主体
      const el = document.createElement('div');
      el.textContent = data.text;
      el.className = `danmaku-item ${data.style}`;
      
      // 随机飞行时间，使速度有差异 (8s - 14s)
      const duration = 8 + Math.random() * 6;
      el.style.animationDuration = `${duration}s`;

      wrapper.appendChild(el);
      container.appendChild(wrapper);

      // 动画结束后清理 DOM
      setTimeout(() => {
        if(wrapper.parentNode) {
          wrapper.parentNode.removeChild(wrapper);
        }
      }, duration * 1000 + 100);
    }

    // 初始化时先发几条
    setTimeout(createDanmaku, 500);
    setTimeout(createDanmaku, 1500);
    setTimeout(createDanmaku, 2500);

    // 持续发射
    setInterval(createDanmaku, 1200);
  </script>

</body>
</html>
