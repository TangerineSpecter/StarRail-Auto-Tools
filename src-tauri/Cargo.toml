[package]
name = "starrail-auto-tools"
version = "1.0.0"
description = "Star Rail automation and local OCR toolbox"
authors = ["StarRail-Auto-Tools contributors"]
edition = "2021"

[lib]
name = "starrail_auto_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# ONNX Runtime is large and ships prebuilt C++ objects. Keep OCR opt-in so a
# normal desktop development build does not depend on that native toolchain.
ocr = ["dep:oar-ocr", "dep:ort"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.26"
oar-ocr = { version = "0.8.1", optional = true }
# oar-ocr 0.8.1 still uses the rc.12 execution-provider API. Cargo otherwise
# considers newer release candidates compatible and currently selects rc.13.
ort = { version = "=2.0.0-rc.12", optional = true }
rfd = "0.17.2"
rust_xlsxwriter = "0.84"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.1.3", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
russh = "0.54"
russh-sftp = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = { version = "8", default-features = false, features = ["rustls-ring"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1.44.2", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
futures = "0.3.31"
pktmon = { version = "0.6.2", features = ["tokio"] }
protobuf = "=3.7.1"
reliquary = { git = "https://github.com/IceDynamix/reliquary", tag = "v22.0.0", features = ["proto-rqa"] }
reliquary-archiver = { git = "https://github.com/IceDynamix/reliquary-archiver", tag = "v0.17.1", default-features = false }
windows = { version = "0.62", features = [
  "Graphics_Capture",
  "Graphics_DirectX",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[patch."https://github.com/IceDynamix/reliquary-archiver"]
# reliquary-archiver v0.17.1 (and earlier) unconditionally compiles a VERSION + ICON
# Win32 resource in its build.rs via `winres`, even when consumed as a library.
# The resulting `resource.lib` is propagated transitively to downstream binaries
# and collides with the VERSION/ICON resource tauri-build emits from
# tauri.conf.json, producing MSVC error CVT1100 / LNK1123.  This vendored copy
# gates that Win32 resource embedding behind a never-enabled Cargo feature so
# tauri-build remains the sole owner of the final executable's resources.
reliquary-archiver = { path = "vendor/reliquary-archiver" }

[profile.dev]
# HoYoverse's KCP implementation uses a timestamp-like field differently from
# the standard kcp crate, which eventually produces an arithmetic overflow in
# `kcp-0.5.3/src/kcp.rs:517` when run with overflow checks enabled.  The
# upstream reliquary-archiver disables overflow checks for the same reason;
# match that policy here so the capture task does not panic mid-sync and leave
# the UI stuck on "同步中" with zero imported records.
overflow-checks = false

[profile.release]
# See [profile.dev] comment above — keep overflow checks disabled in release
# builds as well to avoid the KCP timestamp multiply-with-overflow panic.
overflow-checks = false
